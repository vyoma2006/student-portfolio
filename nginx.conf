server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles /login, /tasks, etc. in the browser.
    # If a file doesn't exist on disk, serve index.html instead of a 404,
    # otherwise refreshing /tasks would break.
    location / {
        try_files $uri $uri/ /index.html;
    }
}