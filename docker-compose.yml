services:
  mongodb:
    image: mongo:7
    container_name: task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db        # named volume: tasks survive container restarts
    networks:
      - app-network
    healthcheck:                   # lets the backend wait until Mongo is really ready
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./task-manager-api
    container_name: task-backend
    restart: on-failure
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      # Service name "mongodb", NOT localhost (localhost inside this container is the container itself)
      MONGO_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      CACHE_TTL: 60
      CACHE_ENABLED: "true"
      NOTIFY_DELAY_MS: 2000
      NOTIFY_MODE: async
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: .
    container_name: task-frontend
    ports:
      - "5173:80"                  # host 5173 -> nginx on port 80 inside the container
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data: